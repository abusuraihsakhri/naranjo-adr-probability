version: '3.8'

services:
  naranjo-adr-probability:
    build: .
    container_name: naranjo-adr-probability
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=naranjo-adr-probability-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
